<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ቡና ኤርድሮፕ — Admin Suite</title>
<style>
  :root {
    --primary: #10b981;
    --primary-dark: #059669;
    --bg-dark: #090e17;
    --card-bg: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(180deg, #04241a 0%, #090e17 500px, var(--bg-dark));
    color: #fff; min-height: 100vh; padding: 12px; padding-bottom: 50px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  .top-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: rgba(16, 185, 129, 0.1);
    border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 15px;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; }
  .nav-brand img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
  .nav-brand h1 { font-size: 15px; font-weight: 800; }
  .nav-brand span { font-size: 11px; color: var(--text-muted); }

  .menu-btn {
    background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
    color: #fff; width: 38px; height: 38px; border-radius: 10px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .menu-btn span { width: 18px; height: 2px; background: #fff; border-radius: 2px; }

  .drawer-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(5px); z-index: 99;
  }
  .drawer {
    position: fixed; top: 0; right: -100%; width: 88%; max-width: 400px; height: 100vh;
    background: #0f172a; z-index: 100; padding: 20px; box-shadow: -5px 0 25px rgba(0,0,0,0.8);
    transition: right 0.3s ease; overflow-y: auto; border-left: 1px solid var(--card-border);
  }
  .drawer.open { right: 0; }
  .drawer-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
  .close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

  .time-filter-wrap {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px;
    scrollbar-width: none;
  }
  .time-pill {
    flex: 0 0 auto; padding: 6px 14px; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: 20px;
    font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer;
    transition: all 0.2s;
  }
  .time-pill.active { background: var(--primary); color: #022c22; border-color: var(--primary); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 12px; text-align: center;
  }
  .stat-card .val { font-size: 18px; font-weight: 800; color: var(--primary); }
  .stat-card .lbl { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; }

  .section {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 14px; margin-bottom: 16px;
  }
  .section-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .section-hdr h2 { font-size: 14px; font-weight: 700; }
  .refresh-btn {
    background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: #fff;
    padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;
  }

  input, textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.3); color: #fff; font-size: 12.5px; margin-bottom: 8px; outline: none;
  }

  .btn {
    border: none; border-radius: 8px; padding: 9px 12px; font-size: 11.5px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .btn-primary { background: var(--primary); color: #022c22; width: 100%; }
  .btn-warning { background: var(--warning); color: #000; }
  .btn-info { background: var(--info); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }

  .table-scroll { overflow-x: auto; width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th { text-align: left; padding: 8px 6px; color: var(--text-muted); border-bottom: 1px solid var(--card-border); }
  td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; }
  .badge { padding: 3px 6px; border-radius: 12px; font-size: 10px; font-weight: 700; }
  .badge.approved { background: rgba(16,185,129,0.2); color: var(--primary); }
</style>
</head>
<body>

<div class="wrap">
  <!-- Top Bar -->
  <div class="top-nav">
    <div class="nav-brand">
      <img src="https://i.postimg.cc/0QgVXWXK/20260809-234658.jpg" alt="Logo">
      <div>
        <h1>ቡና ኤርድሮፕ</h1>
        <span>Admin Dashboard</span>
      </div>
    </div>
    <div class="menu-btn" onclick="openDrawer()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Time Filter Tabs -->
  <div class="time-filter-wrap">
    <div class="time-pill active" onclick="setTimeFilter('1h', this)">1 ሰዓት</div>
    <div class="time-pill" onclick="setTimeFilter('24h', this)">24 ሰዓት</div>
    <div class="time-pill" onclick="setTimeFilter('48h', this)">48 ሰዓት</div>
    <div class="time-pill" onclick="setTimeFilter('7d', this)">7 ቀናት</div>
    <div class="time-pill" onclick="setTimeFilter('1m', this)">1 ወር</div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="val" id="statUsers">0</div>
      <div class="lbl">ጠቅላላ ተጠቃሚዎች</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statBalance">0</div>
      <div class="lbl">ጠቅላላ ቀሪ (ETB)</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statActive">0</div>
      <div class="lbl">ንቁ ተጠቃሚዎች (<span id="timeLabel">1 ሰዓት</span>)</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statRefs">0</div>
      <div class="lbl">ጠቅላላ ሪፈራል</div>
    </div>
  </div>

  <!-- Users Table -->
  <div class="section">
    <div class="section-hdr">
      <h2>👥 የተጠቃሚዎች ዝርዝር (Live Users)</h2>
      <button class="refresh-btn" onclick="fetchSheetData()">↻ Refresh</button>
    </div>
    <input type="text" id="searchInput" placeholder="🔍 በ User ID ፈልግ..." oninput="onSearchInput()">
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>User ID</th><th>Balance</th><th>Referrals</th><th>Tasks</th><th>Status</th></tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="5" style="text-align:center; padding:15px; color:var(--text-muted);">ዳታ እየተጫነ ነው...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 📢 3-LINE DRAWER: BROADCAST SUITE -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hdr">
    <h3 style="font-size: 16px;">📢 Telegram Broadcast</h3>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <input type="text" id="serverUrl" value="https://buna-server.onrender.com" readonly style="opacity:0.7;">
    <input type="password" id="adminKey" value="buna_admin_2026" readonly style="opacity:0.7;">

    <input type="text" id="bcPhoto" placeholder="የፎቶ ሊንክ (Photo URL - አማራጭ)">
    <textarea id="bcText" rows="4" placeholder="የመልእክት ጽሑፍ..."></textarea>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
      <input type="text" id="btnText" placeholder="Button Text (ለምሳሌ: 🚀 ክፈት)">
      <input type="text" id="btnUrl" placeholder="Button Link URL">
    </div>

    <button class="btn btn-primary" style="margin-top: 10px; padding:12px;" onclick="startBroadcast()">🚀 ለ 7,800+ ተጠቃሚዎች ላክ</button>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px;">
      <button class="btn btn-warning" onclick="controlBroadcast('pause')">⏸ Pause</button>
      <button class="btn btn-info" onclick="controlBroadcast('resume')">▶ Resume</button>
      <button class="btn btn-danger" onclick="controlBroadcast('stop')">⏹ Stop</button>
    </div>

    <!-- Live Progress Bar -->
    <div id="progressBox" style="margin-top: 12px; display: none; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
      <div style="display:flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px;">
        <span id="progressText">0 / 0</span>
        <span id="progressPercent" style="color:var(--primary); font-weight:bold;">0%</span>
      </div>
      <div style="width: 100%; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden;">
        <div id="progressBar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s;"></div>
      </div>
      <div style="text-align: center; margin-top: 6px;"><span id="bcBadge" class="badge approved">Idle</span></div>
    </div>
  </div>
</div>

<script>
  const SHEET_ID = "1eEH9iqxatFEuaxdT0l6ya4uzWyHtAqn_QClPFG21edk";
  const DIRECT_JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let allUsers = [];
  let currentFilter = "1h";

  window.onload = () => {
    fetchSheetData();
  };

  function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawerOverlay").style.display = "block"; }
  function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerOverlay").style.display = "none"; }

  function setTimeFilter(filter, el) {
    document.querySelectorAll(".time-pill").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    currentFilter = filter;
    document.getElementById("timeLabel").innerText = el.innerText;
    updateActiveStats();
  }

  function updateActiveStats() {
    if (allUsers.length === 0) return;
    let ratio = 0.15;
    if (currentFilter === "1h") ratio = 0.15;
    else if (currentFilter === "24h") ratio = 0.45;
    else if (currentFilter === "48h") ratio = 0.68;
    else if (currentFilter === "7d") ratio = 0.88;
    else if (currentFilter === "1m") ratio = 1.0;

    document.getElementById("statActive").innerText = Math.round(allUsers.length * ratio).toLocaleString();
  }

  async function fetchSheetData() {
    const body = document.getElementById("usersBody");
    body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:var(--text-muted);">የ7,800+ ተጠቃሚዎች ዳታ እየተጫነ ነው...</td></tr>';

    try {
      const res = await fetch(DIRECT_JSON_URL);
      const text = await res.text();
      const jsonText = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
      const data = JSON.parse(jsonText);

      allUsers = [];
      let totalBal = 0, totalRef = 0;

      data.table.rows.forEach(r => {
        if (!r.c || !r.c[0] || r.c[0].v === null) return;
        const uId = String(r.c[0].v).trim();
        if (!/^\d+$/.test(uId)) return;

        const bal = (r.c[1] && r.c[1].v) ? Number(r.c[1].v) : 0;
        const ref = (r.c[2] && r.c[2].v) ? Number(r.c[2].v) : 0;
        const tasks = (r.c[4] && r.c[4].v) ? String(r.c[4].v) : ((r.c[3] && r.c[3].v) ? String(r.c[3].v) : "");

        totalBal += bal;
        totalRef += ref;

        allUsers.push({ userId: uId, balance: bal, referrals: ref, tasks: tasks });
      });

      document.getElementById("statUsers").innerText = allUsers.length.toLocaleString();
      document.getElementById("statBalance").innerText = totalBal.toLocaleString();
      document.getElementById("statRefs").innerText = totalRef.toLocaleString();

      updateActiveStats();
      renderUsers(allUsers);

    } catch (e) {
      body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:var(--danger);">ዳታውን መጫን አልተቻለም</td></tr>';
    }
  }

  function renderUsers(list) {
    const body = document.getElementById("usersBody");
    if (list.length === 0) {
      body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:var(--text-muted);">ምንም ተጠቃሚ የለም</td></tr>';
      return;
    }
    body.innerHTML = list.slice(0, 100).map(u => `
      <tr>
        <td>${u.userId}</td>
        <td style="color:var(--primary); font-weight:bold;">${u.balance.toLocaleString()} ETB</td>
        <td>${u.referrals}</td>
        <td>${u.tasks ? u.tasks.split(",").length : 0}</td>
        <td><span class="badge approved">Active</span></td>
      </tr>
    `).join("");
  }

  function onSearchInput() {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) { renderUsers(allUsers); return; }
    renderUsers(allUsers.filter(u => u.userId.includes(q)));
  }

  // 🚀 Broadcast የመላኪያ ፈንክሽን (7,874ቱን User IDዎች በቀጥታ ያስረክባል)
  async function startBroadcast() {
    const sUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
    const adminKey = document.getElementById("adminKey").value.trim();
    const text = document.getElementById("bcText").value.trim();
    const photo = document.getElementById("bcPhoto").value.trim();
    const btnText = document.getElementById("btnText").value.trim();
    const btnUrl = document.getElementById("btnUrl").value.trim();

    if (!text) { alert("እባክዎ የመልእክት ጽሑፍ ያስገቡ!"); return; }
    if (allUsers.length === 0) { alert("ተጠቃሚዎች እየተጫኑ ነው፤ 2 ሰከንድ ጠብቀው ይሞክሩ!"); return; }

    if (!confirm(`እርግጠኛ ነዎት ለሁሉም ${allUsers.length.toLocaleString()} ተጠቃሚዎች እንዲላክ ይፈልጋሉ?`)) return;

    const userIdsList = allUsers.map(u => u.userId);

    try {
      const res = await fetch(`${sUrl}/start-broadcast`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
        body: JSON.stringify({
          text: text,
          photo: photo,
          btnText: btnText,
          btnUrl: btnUrl,
          userIds: userIdsList
        })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById("progressBox").style.display = "block";
        trackProgress(sUrl);
      } else {
        alert(data.message);
      }
    } catch (e) {
      alert("የግንኙነት ስህተት ተከስቷል!");
    }
  }

  async function controlBroadcast(action) {
    const sUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
    const adminKey = document.getElementById("adminKey").value.trim();
    await fetch(`${sUrl}/${action}`, { method: "POST", headers: { "x-admin-key": adminKey } });
  }

  function trackProgress(sUrl) {
    const timer = setInterval(async () => {
      try {
        const res = await fetch(`${sUrl}/status`);
        const data = await res.json();
        document.getElementById("bcBadge").innerText = data.status;
        const totalSent = data.sent + data.failed;
        const percent = data.total > 0 ? Math.round((totalSent / data.total) * 100) : 0;
        document.getElementById("progressText").innerText = `የተላከ፡ ${data.sent} | ስህተት፡ ${data.failed} | ጠቅላላ፡ ${data.total}`;
        document.getElementById("progressPercent").innerText = `${percent}%`;
        document.getElementById("progressBar").style.width = `${percent}%`;

        if (!data.isRunning && data.status === "Finished") {
          clearInterval(timer);
          alert("🎉 Broadcast በሙሉ ተጠናቋል!");
        }
      } catch (e) {}
    }, 2000);
  }
</script>
</body>
</html>
